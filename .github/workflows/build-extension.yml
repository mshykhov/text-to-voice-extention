name: Build Extension

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create extension package
      run: |
        # Create zip with extension files
        zip -r text-to-voice-extension.zip \
          manifest.json \
          src/ \
          icons/ \
          -x "*.git*" "*.DS_Store" "node_modules/*" "scripts/*" "tests/*"

        # Show zip contents
        echo "Package contents:"
        unzip -l text-to-voice-extension.zip

        # Show file size
        ls -lh text-to-voice-extension.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: text-to-voice-extension
        path: text-to-voice-extension.zip
        retention-days: 90

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: text-to-voice-extension.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
