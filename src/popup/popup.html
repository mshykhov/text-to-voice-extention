<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text-to-Voice Reader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔊 Text-to-Voice</h1>
    </header>

    <div id="error-message" class="error hidden"></div>
    <div id="success-message" class="success hidden"></div>

    <!-- API Key Section (collapsible when saved) -->
    <div id="api-key-section" class="api-key-section">
      <div class="input-group">
        <input
          type="password"
          id="api-key-input"
          placeholder="Enter OpenAI API Key..."
          autocomplete="off"
        >
        <button id="save-key-btn" class="btn-small">Save</button>
      </div>
      <p class="help-text">
        <a href="https://platform.openai.com/api-keys" target="_blank">Get API key</a>
      </p>
    </div>

    <!-- Minimal Settings -->
    <div id="settings-section" class="settings hidden">
      <div class="setting-row">
        <label for="voice-select">Voice</label>
        <select id="voice-select">
          <option value="alloy">Alloy (neutral)</option>
          <option value="echo">Echo (male)</option>
          <option value="nova">Nova (female)</option>
          <option value="onyx">Onyx (deep)</option>
          <option value="shimmer">Shimmer (soft)</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="speed-slider">Speed</label>
        <div class="slider-container">
          <input
            type="range"
            id="speed-slider"
            min="0.5"
            max="2.0"
            step="0.25"
            value="1.0"
            class="slider"
          >
          <span class="slider-value" id="speed-value">1.0x</span>
        </div>
      </div>
    </div>

    <!-- Main Control Button -->
    <div class="controls">
      <button id="start-btn" class="btn btn-primary">▶ Read Page</button>
      <button id="pause-btn" class="btn btn-warning hidden">⏸ Pause</button>
      <button id="resume-btn" class="btn btn-success hidden">▶ Resume</button>
      <button id="stop-btn" class="btn btn-danger hidden">■ Stop</button>
    </div>

    <!-- Navigation Controls -->
    <div class="navigation-controls hidden" id="nav-controls">
      <button id="prev-btn" class="btn-nav">⏮ Prev</button>
      <button id="next-btn" class="btn-nav">⏭ Next</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
